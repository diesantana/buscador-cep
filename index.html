<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de CEP</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts - Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- header -->
    <header>
        <nav>
            <h1>BuscaCEP</h1>
            <a href="#contato">Contato</a>
        </nav>
    </header>
    <main>
        <!-- Busca do CEP -->
        <section class="cep-search">
            <h2>Consultar CEP</h2>
            <form id="cep-form">
                <label for="cep" class="sr-only">CEP</label>
                <div class="input-group">
                    <input type="text" name="cep" id="cep" class="input-cep" placeholder="Digite o CEP" maxlength="9" required>
                    <div class="input-cep-error">O CEP informado é inválido!</div>
                </div>
                <button type="submit">Buscar</button>
            </form>
        </section>
        <!-- Resultado -->
        <section class="cep-result" id="resultado">
            <h2>Resultado</h2>
            <div class="cep-data" id="cep-data">
                <p>Digite um CEP para buscar o endereço.</p>
            </div>
        </section>
    </main>
    <!-- Footer -->
    <footer id="contato">
        <h2>Contato</h2>
        <p>Desenvolvido por Diego Santana</p>
        <div class="contato-links">
            <a href="https://github.com/diesantana" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/die-santana/" target="_blank">LinkedIn</a>
        </div>
    </footer>
    <script type="module" src="js/main.js"></script>
</body>

</html>
